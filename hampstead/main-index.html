<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hampstead</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: wide = story with docked controls on the left, map and bag rail on the right; narrow = three tabbed panes. */
:root{
  --bg:#ECEFEA; --surface:#F8F9F6; --ink:#17201D; --muted:#5A6760; --line:#C9D0C9; --soft:#E0E6DF;
  --plaque:#1C4A8A; --plaque-ink:#F4F7FC; --good:#2B6A47; --bad:#9C3F2B;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --ui:'Barlow',system-ui,-apple-system,sans-serif;
  --read:'Libre Caslon Text',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412; --surface:#161F1B; --ink:#E7ECE7; --muted:#92A098; --line:#2A3630; --soft:#1F2B26;
    --plaque:#5B8FD8; --plaque-ink:#0A111F; --good:#6CBF93; --bad:#E58B73; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1B; --ink:#E7ECE7; --muted:#92A098; --line:#2A3630; --soft:#1F2B26;
  --plaque:#5B8FD8; --plaque-ink:#0A111F; --good:#6CBF93; --bad:#E58B73; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--ui); font-size:17px;
  padding-block:12px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--plaque); outline-offset:2px}

.app{height:100%; display:grid; grid-template-columns:minmax(0,1fr) 310px; grid-template-rows:auto auto minmax(0,1fr); gap:12px 18px}
.top{grid-column:1/-1; display:flex; align-items:center; gap:14px 26px; flex-wrap:wrap}
.plaque{
  background:var(--plaque); color:var(--plaque-ink); border-radius:999px; padding:7px 24px 8px; text-align:center;
  box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--plaque); margin:4px;
}
.plaque b{display:block; font-family:var(--display); font-size:27px; font-weight:700; letter-spacing:.16em; line-height:1.05}
.plaque span{display:block; font-family:var(--display); font-size:11.5px; font-weight:600; letter-spacing:.2em; text-transform:uppercase; opacity:.92}
.stats{display:flex; align-items:flex-end; gap:12px 28px; flex:1; min-width:0; flex-wrap:wrap}
.stat{min-width:0}
.lab{font-family:var(--display); font-size:12.5px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
.val{font-family:var(--display); font-size:28px; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums}
.stand{flex:1 1 280px; max-width:460px}
.stand .row{display:flex; align-items:baseline; gap:10px}
.rung{font-family:var(--ui); font-size:15px; font-weight:500; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bar{position:relative; height:9px; background:var(--soft); border-radius:99px; margin-top:6px; overflow:hidden}
.bar i{position:absolute; inset:0 auto 0 0; background:var(--plaque); border-radius:99px; transition:width .35s}
.bar u{position:absolute; top:0; bottom:0; width:2px; background:var(--bg)}

.tabs{display:none; grid-column:1/-1; grid-template-columns:repeat(3,1fr); gap:8px}
.tabs button{min-height:46px; border:1.5px solid var(--line); border-radius:12px; background:var(--surface); font-family:var(--display); font-size:17px; font-weight:600; letter-spacing:.12em; text-transform:uppercase}
.tabs button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}

.story{display:flex; flex-direction:column; min-height:0; min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden}
#log{position:relative; flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:10px 28px 22px; -webkit-overflow-scrolling:touch}
#log>*{max-width:64ch}
.p{font-family:var(--read); font-size:20px; line-height:1.62; margin:0 0 .85em}
.p em{font-style:italic}
.p.aside{color:var(--muted); font-size:18px; font-style:italic}
.p.lede{font-size:22px}
.kicker{font-family:var(--display); font-size:14px; letter-spacing:.2em; text-transform:uppercase; color:var(--plaque); font-weight:600; margin:18px 0 6px}
.tip{font-family:var(--ui); font-size:15.5px; color:var(--muted); border-top:1px solid var(--line); padding-top:12px; margin-top:6px}
.loc{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; border-top:2px solid var(--ink); margin:26px 0 12px; padding-top:8px}
.loc h2{margin:0; font-family:var(--display); font-size:30px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; line-height:1.1; text-wrap:balance}
.loc .sub{font-family:var(--display); font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:500}
.cmd{font-family:var(--ui); font-size:15.5px; color:var(--muted); margin:16px 0 8px; padding-left:12px; border-left:3px solid var(--plaque)}
.delta{display:inline-block; font-size:14.5px; font-weight:600; padding:2px 11px; margin:0 8px 12px 0; border-radius:99px; border:1.5px solid currentColor; font-variant-numeric:tabular-nums}
.delta.good{color:var(--good)} .delta.bad{color:var(--bad)}
.choices{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px}
.end{border:2px solid var(--plaque); border-radius:16px; padding:6px 22px 18px; margin:22px 0 8px}
.end h3{font-family:var(--display); font-size:34px; letter-spacing:.08em; text-transform:uppercase; margin:12px 0 4px; color:var(--plaque)}
.end .score{font-family:var(--display); font-size:19px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:12px}
.end ul{list-style:none; padding:0; margin:0 0 14px; font-size:16px}
.end li{display:flex; gap:12px; padding:5px 0; border-bottom:1px solid var(--line)}
.end li b{min-width:44px; font-variant-numeric:tabular-nums}

.dock{border-top:1px solid var(--line); padding:12px 16px 14px; display:grid; gap:10px; max-height:50%; overflow-y:auto; background:var(--surface)}
.exits{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:8px}
.exit{display:flex; align-items:center; gap:10px; min-height:52px; padding:6px 14px 6px 8px; text-align:left; border:1.5px solid var(--line); background:var(--bg); border-radius:14px; font-size:17px; font-weight:500}
.dir{flex:none; min-width:32px; height:32px; padding:0 6px; display:grid; place-items:center; border-radius:99px; background:var(--ink); color:var(--bg); font-family:var(--display); font-size:14.5px; font-weight:700; letter-spacing:.06em}
.acts{display:flex; flex-wrap:wrap; gap:8px}
.act,.go{min-height:48px; padding:0 20px; border-radius:99px; border:1.5px solid var(--plaque); color:var(--plaque); background:transparent; font-size:17px; font-weight:600}
.sys{display:flex; flex-wrap:wrap; gap:8px}
.ghost{min-height:44px; padding:0 16px; border-radius:12px; border:1.5px solid var(--line); background:transparent; font-size:15.5px; font-weight:500; color:var(--muted)}
.cmdline{display:flex; gap:8px}
.cmdline input{flex:1; min-width:0; min-height:48px; padding:0 16px; font:inherit; font-size:18px; color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:14px}
.cmdline input::placeholder{color:var(--muted)}
.go{background:var(--plaque); color:var(--plaque-ink)}
.exit:active,.act:active,.ghost:active,.go:active{transform:scale(.975)}
@media (hover:hover){
  .exit:hover{border-color:var(--plaque)} .act:hover{background:var(--plaque); color:var(--plaque-ink)} .ghost:hover{color:var(--ink); border-color:var(--ink)}
}

.side{display:flex; flex-direction:column; gap:12px; min-height:0; min-width:0; overflow-y:auto}
.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px 16px}
.card h3{margin:0 0 8px; font-family:var(--display); font-size:15px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--muted)}
#map{display:block; width:100%; height:auto}
.mnode{fill:var(--surface); stroke:var(--ink); stroke-width:2}
.mnode.here{fill:var(--plaque); stroke:var(--plaque)}
.mnode.fog{fill:none; stroke:var(--muted); stroke-dasharray:3 3; stroke-width:1.5}
.mring{fill:none; stroke:var(--plaque); stroke-width:1.5; opacity:.45}
.medge{stroke:var(--line); stroke-width:2.5; stroke-linecap:round}
.mlab{font-family:var(--display); font-size:12.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; fill:var(--ink)}
.mlab.here{fill:var(--plaque); font-weight:700}
.mnote{font-family:var(--display); font-size:13px; font-weight:700; fill:var(--muted); letter-spacing:.1em}
.bag{list-style:none; margin:0; padding:0; display:grid; gap:6px}
.bag button{width:100%; min-height:46px; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 12px; text-align:left; border:1px solid var(--line); border-radius:12px; background:var(--bg); font-size:16.5px}
.bag .tag{font-family:var(--display); font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--plaque); font-weight:700}
.money{margin:10px 0 0; font-size:15.5px; color:var(--muted)}
.notes{list-style:none; margin:0; padding:0; display:grid; gap:8px; font-size:15.5px; line-height:1.4}
.notes li{padding-left:12px; border-left:3px solid var(--line)}
.empty{color:var(--muted); font-size:15.5px; margin:0}
.restart{align-self:flex-start}

@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .tabs{display:grid}
  .story,.side{grid-column:1}
  .app[data-pane="story"] .side{display:none}
  .app[data-pane="map"] .story,.app[data-pane="bag"] .story{display:none}
  .app[data-pane="map"] .bagc,.app[data-pane="bag"] .mapc{display:none}
  .app[data-pane="map"] .side,.app[data-pane="bag"] .side{overflow:visible}
  #log{padding:6px 18px 18px}
  .p{font-size:19px}
  .val{font-size:25px}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none} .exit:active,.act:active,.ghost:active,.go:active{transform:none}}
</style>
</head>
<body>

<div class="app" id="app" data-pane="story">
  <header class="top">
    <div class="plaque"><b>HAMPSTEAD</b><span>N.W.3 · A Social Ascent</span></div>
    <div class="stats">
      <div class="stat stand">
        <div class="lab">Standing</div>
        <div class="row"><span class="val" id="stand">5</span><span class="rung" id="rung"></span></div>
        <div class="bar" id="barwrap"><i id="bar"></i></div>
      </div>
      <div class="stat"><div class="lab">Cash</div><div class="val" id="cash">£21.80</div></div>
      <div class="stat"><div class="lab">Sat 14 June 1986</div><div class="val" id="clock">09:00</div></div>
    </div>
  </header>

  <nav class="tabs" aria-label="Panels">
    <button type="button" data-pane="story" aria-pressed="true">Story</button>
    <button type="button" data-pane="map" aria-pressed="false">Map</button>
    <button type="button" data-pane="bag" aria-pressed="false">Bag</button>
  </nav>

  <section class="story" aria-label="Story">
    <div id="log" role="log" aria-live="polite"></div>
    <div class="dock">
      <div class="exits" id="exits"></div>
      <div class="acts" id="acts"></div>
      <div class="sys" id="sys"></div>
      <form class="cmdline" id="cmd" autocomplete="off">
        <input id="in" type="text" placeholder="Or type what you want to do, e.g. buy paper" enterkeyhint="go" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Type a command">
        <button class="go" type="submit">Go</button>
      </form>
    </div>
  </section>

  <aside class="side">
    <div class="card mapc"><h3>The Village</h3><svg id="map" viewBox="0 0 300 360" role="img" aria-label="Map of Hampstead"></svg></div>
    <div class="card bagc">
      <h3>Bag</h3>
      <ul class="bag" id="bag"></ul>
      <p class="money" id="money"></p>
      <h3 style="margin-top:16px">Filofax</h3>
      <ul class="notes" id="notes"></ul>
      <button class="ghost restart" id="restart" type="button" style="margin-top:16px">New game</button>
    </div>
  </aside>
</div>

<script>
(function(){
'use strict';
var KEY='hampstead-1986-save-v1';
var START_CASH=2180, OPEN=30, SHUT=510, PARTY=630, LATE=720;
var $=function(s){return document.querySelector(s)};
var pad=function(n){return String(n).padStart(2,'0')};
var money=function(p){return '£'+(Math.abs(p)/100).toFixed(2)};
var clock=function(t){var m=540+t;return pad(Math.floor(m/60)%24)+':'+pad(m%60)};
var LADDER=[[0,'Off the Northern Line'],[15,'Seen on the Heath'],[30,'Known to the Newsagent'],[45,'Nodded at in the Deli'],[60,'Recognised at the Flask'],[75,'Provisionally Interesting'],[90,'Church Row']];
var rung=function(n){var r=LADDER[0][1];LADDER.forEach(function(l){if(n>=l[0])r=l[1]});return r};

var ITEMS={
  filofax:['Filofax','Black, gilt-edged, and containing exactly one number: your mother’s.'],
  ham:['Ham & High','This week’s local paper, already creased by someone with opinions.'],
  keats_book:['Collected Keats','A second-hand paperback. Someone has underlined the word “fever” twice.'],
  straws:['Cheese straws','A paper bag of them, still warm. Dogs have committed worse crimes for less.'],
  wine:['Pommard','A bottle of red Burgundy with a label that suggests it knows things.'],
  liebfraumilch:['Liebfraumilch','Sweet, German, and priced to be forgiven.'],
  blazer:['Navy blazer','Gilt buttons, a little stiff. It makes you look like someone’s idea of a godfather.'],
  invitation:['Invitation','A stiff white card. Lady Ottoline Fane. Number 9, Church Row. Half past seven.']
};

var S;
function fresh(){return {v:1,loc:'station',t:0,standing:5,cash:START_CASH,inv:['filofax'],flags:{},visited:{station:1},log:[],end:null}}
var has=function(id){return S.inv.indexOf(id)>-1};
var give=function(id){if(!has(id))S.inv.push(id)};
var drop=function(id){S.inv=S.inv.filter(function(x){return x!==id})};
var adv=function(m){S.t+=m};
function say(h,c){S.log.push({k:'p',h:h,c:c||''})}
function stand(n){S.standing=Math.max(0,Math.min(100,S.standing+n));S.log.push({k:'delta',h:(n>=0?'+':'−')+Math.abs(n)+' Standing',tone:n>=0?'good':'bad'})}
function earn(p){S.cash+=p;S.log.push({k:'delta',h:'+'+money(p),tone:'good'})}
function pay(p){
  if(S.cash<p){say('You count your money twice. It stays at '+money(S.cash)+'. You need '+money(p)+'.','aside');return false}
  S.cash-=p;S.log.push({k:'delta',h:'−'+money(p),tone:'bad'});return true;
}
var open=function(){return S.t>=OPEN&&S.t<SHUT};
var tarquinHere=function(){return S.t>=120&&S.t<360};
function A(label,kw,run,grp){return {label:label,kw:kw||'',run:run,grp:grp||'do'}}

/* ---------- World ---------- */
var LOC={
 station:{n:'Hampstead Station',m:'Station',s:'Northern Line · 55 m down',x:150,y:195,
  ex:[{d:'n',to:'heath_st',l:'Heath Street'},{d:'s',to:'high_st',l:'High Street'}],
  d:function(){return 'The lift gates clatter open and the deepest station on the Underground releases you into the light, slightly pale. Behind you the lift attendant is reading a paperback with the contentment of a man who has watched everyone arrive and no one leave. Heath Street climbs north. The High Street slopes away south. By the exit, a newsagent’s stand holds a stack of the <em>Ham &amp; High</em>.'},
  a:function(){var r=[];
   if(!has('ham')&&!S.flags.read)r.push(A('Buy the Ham & High (30p)','buy paper newspaper ham high news',function(){if(!pay(30))return;give('ham');adv(5);say('The newsagent hands it over at the speed of a man who has handed over a great many and approved of none.')}));
   r.push(A('Talk to the lift attendant','talk lift attendant man ask',function(){adv(5);
     if(!S.flags.lift){S.flags.lift=1;say('‘Church Row?’ He lowers the paperback an inch. ‘Down the High Street, then left. Sorry, right. West. Number 9 has the blue door, and has never once opened it to anyone who wasn’t expected.’ He raises the paperback again. The conversation has been, for him, a considerable event.')}
     else say('He turns a page. It is the most eloquent thing he has said all day.')}));
   return r}},
 heath_st:{n:'Heath Street',m:'Heath St',s:'NW3',x:150,y:120,
  ex:[{d:'s',to:'station',l:'Station'},{d:'n',to:'pond',l:'Whitestone Pond'},{d:'w',to:'deli',l:'Le Petit Pain',k:'deli shop enter'},{d:'e',to:'bookshop',l:'Dunsany & Hale',k:'bookshop books enter'}],
  d:function(){return 'Heath Street climbs between shopfronts that have never needed a sale. A deli to the west has a window full of things that are not quite food yet. To the east a second-hand bookshop has a tabby asleep across the threshold. Northward the road gives up on commerce and turns toward the Heath. The station is back down the hill.'},
  a:function(){return []}},
 deli:{n:'Le Petit Pain',m:'Deli',s:'Heath Street',x:75,y:120,shop:1,parent:'heath_st',
  ex:[{d:'out',to:'heath_st',l:'Back to Heath Street'}],
  d:function(){return 'A narrow deli lit like a jeweller’s. A woman in an apron the colour of clotted cream regards you the way a customs officer regards a suitcase. Cheeses sit under glass domes. Along one wall is a short shelf of wine arranged by price, the dear end facing the door.'},
  a:function(){var r=[],F=S.flags;
   if(!has('straws'))r.push(A('Buy cheese straws (£1.50)','buy cheese straws bag',function(){if(!pay(150))return;give('straws');adv(5);say('She twists the paper bag shut with great finality. ‘Gruyère,’ she says. ‘Not for dogs.’ You thank her for the warning.')}));
   if(!has('wine'))r.push(A('Buy the Pommard (£14.00)','buy pommard burgundy red wine expensive',function(){if(!pay(1400))return;give('wine');adv(5);say('‘A sound choice,’ she says, in the voice of someone granting a pardon.')}));
   if(!has('wine')&&!has('liebfraumilch'))r.push(A('Buy the Liebfraumilch (£2.99)','buy liebfraumilch cheap wine german white',function(){if(!pay(299))return;give('liebfraumilch');adv(5);say('She wraps it. She says nothing at all. It is the loudest thing she has said all morning.')}));
   if(!F.wineAdvice)r.push(A('Ask what to bring to a party','ask advice wine party bring',function(){F.wineAdvice=1;adv(5);say('‘For a house like that? The Pommard.’ She lifts the other bottle by its neck, briefly, like evidence. ‘The Liebfraumilch is what people bring when they would like to be forgotten.’')}));
   return r}},
 bookshop:{n:'Dunsany & Hale',m:'Bookshop',s:'Booksellers · Heath Street',x:225,y:120,shop:1,parent:'heath_st',
  ex:[{d:'out',to:'heath_st',l:'Back to Heath Street'}],
  d:function(){return 'Paperbacks from floor to ceiling, a ladder, a cat, and a proprietor who speaks only to customers he approves of. The poetry shelf is at eye level, which is unusual and a little hopeful.'},
  a:function(){var r=[],F=S.flags;
   if(!has('keats_book')&&!F.keats)r.push(A('Buy the Collected Keats (£2.00)','buy keats book poetry paperback',function(){if(!pay(200))return;give('keats_book');adv(5);say('The proprietor takes your money without looking at it, then looks at you, once, in a way that suggests you are on probation.')}));
   if(!F.browsed)r.push(A('Browse the poetry shelf','browse poetry shelf look books',function(){F.browsed=1;adv(10);say('You learn that Keats lived round the corner, that he died in Rome at twenty-five, and that this is considered a perfectly normal thing to know in these parts.')}));
   return r}},
 pond:{n:'Whitestone Pond',m:'Whitestone Pond',s:'The Heath · NW3',x:150,y:45,
  ex:[{d:'s',to:'heath_st',l:'Heath Street'},{d:'e',to:'kenwood',l:'Kenwood (across the Heath)',k:'kenwood house path'}],
  d:function(){var F=S.flags;return 'At the top of the hill a small round pond sits in a green saucer, ringed by benches and men with radio-controlled boats. The air is suddenly four degrees cleaner. London lies below, sulking in haze. '+((!F.dogWith&&!F.dogReturned)?'Under the nearest bench, something small, beige and furious is looking at you.':'Under the nearest bench there is only a dent in the grass the shape of a Pekingese’s resentment.')},
  a:function(){var r=[],F=S.flags;
   if(!F.dogWith&&!F.dogReturned){
     if(has('straws'))r.push(A('Coax the dog with cheese straws','coax dog cheese straws offer feed bartholomew',function(){drop('straws');F.dogWith=1;adv(10);say('Bartholomew considers the straw, then your character, then the straw. He takes it with the delicacy of a bishop accepting a cheque. Within a minute he is at your heel, tail curled like a question mark that has been answered in his favour.')}));
     r.push(A('Pick up the dog','pick up dog grab bartholomew',function(){adv(10);stand(-2);say('Bartholomew bites you on the thumb with the precision of a surgeon and returns to the bench. A man with a model yacht pretends not to have seen.')}));
   }
   return r}},
 kenwood:{n:'Kenwood House',m:'Kenwood',s:'The Iveagh Bequest',x:255,y:45,
  ex:[{d:'w',to:'pond',l:'Whitestone Pond'}],
  d:function(){return 'A white mansion rises from the lawn like a wedding cake that has been to university. Inside, the Iveagh Bequest hangs on the walls: a Vermeer, some Gainsboroughs, and an old man in a cap who looks at you as though you owe him money.'},
  a:function(){var r=[];
   if(!S.flags.art)r.push(A('Study the Rembrandt (20 min)','study rembrandt self portrait painting art',function(){S.flags.art=1;adv(20);say('You stand in front of the self-portrait until you can say something. The something is: ‘He has painted himself without vanity, which is the most vain thing a man can do.’ You have no idea whether this is true. It will go down very well.');stand(5)}));

      var e=LOC[S.loc].ex.filter(function(x){return x.l===a.label})[0];
      var b=document.createElement('button');b.type='button';b.className='exit';
      var dl={n:'N',s:'S',e:'E',w:'W','in':'IN',out:'OUT'}[e.d];
      b.innerHTML='<span class="dir">'+dl+'</span><span></span>';b.lastChild.textContent=a.label;
      b.addEventListener('click',function(){exec(a)});ex.appendChild(b);
    }else if(a.grp==='do')ac.appendChild(btn(a.label,'act',function(){exec(a)}));
    else sy.appendChild(btn(a.label,'ghost',function(){exec(a)}));
  });
}
function drawBag(){
  var ul=$('#bag');ul.innerHTML='';
  S.inv.forEach(function(id){
    var li=document.createElement('li');
    var b=document.createElement('button');b.type='button';
    var tag=(id==='blazer'&&S.flags.worn)?'<span class="tag">worn</span>':'';
    b.innerHTML='<span></span>'+tag;b.firstChild.textContent=ITEMS[id][0];
    b.addEventListener('click',function(){S.log.push({k:'p',h:ITEMS[id][1],c:'aside'});save();renderAll();$('#app').setAttribute('data-pane','story');syncTabs()});
    li.appendChild(b);ul.appendChild(li);
  });
  $('#money').textContent='Cash in pocket: '+money(S.cash);
  var n=$('#notes');n.innerHTML='';
  var any=false;
  NOTES.forEach(function(x){if(S.flags[x[0]]){any=true;var li=document.createElement('li');li.textContent=x[1];n.appendChild(li)}});
  if(!any){var li=document.createElement('li');li.className='empty';li.style.borderLeftColor='transparent';li.textContent='One number: your mother’s. Things you learn will be written here.';n.appendChild(li)}
}
function drawMap(){
  var vis=S.visited,shown={},h='',seen={};
  Object.keys(vis).forEach(function(k){shown[k]=1;LOC[k].ex.forEach(function(e){shown[e.to]=1})});
  Object.keys(shown).forEach(function(k){LOC[k].ex.forEach(function(e){
    if(!shown[e.to]||!(vis[k]||vis[e.to]))return;
    var key=[k,e.to].sort().join('|');if(seen[key])return;seen[key]=1;
    h+='<line class="medge" x1="'+LOC[k].x+'" y1="'+LOC[k].y+'" x2="'+LOC[e.to].x+'" y2="'+LOC[e.to].y+'"/>';
  })});
  Object.keys(shown).forEach(function(k){
    var L=LOC[k],here=k===S.loc,v=vis[k];
    if(here)h+='<circle class="mring" cx="'+L.x+'" cy="'+L.y+'" r="15"/>';
    h+='<circle class="mnode'+(here?' here':v?'':' fog')+'" cx="'+L.x+'" cy="'+L.y+'" r="'+(here?9:7)+'"/>';
    if(v){
      var right=L.x>=200&&L.y>=220;
      h+='<text class="mlab'+(here?' here':'')+'" x="'+(right?L.x+15:L.x)+'" y="'+(right?L.y+4:L.y+25)+'" text-anchor="'+(right?'start':'middle')+'">'+L.m+'</text>';
    }
  });
  h+='<text class="mnote" x="288" y="16" text-anchor="end">N ↑</text>';
  $('#map').innerHTML=h;
}
function syncTabs(){
  var p=$('#app').getAttribute('data-pane');
  document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-pane')===p?'true':'false')});
}

/* ---------- Save / restart ---------- */
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{var j=localStorage.getItem(KEY);if(j){var o=JSON.parse(j);if(o&&o.v===1&&LOC[o.loc])return o}}catch(e){}return null}
function newGame(){
  S=fresh();S.log.push({k:'intro'});describe();
  rendered=0;$('#log').innerHTML='';save();renderAll();$('#log').scrollTop=0;
  $('#app').setAttribute('data-pane','story');syncTabs();
}

/* ---------- Boot ---------- */
document.querySelectorAll('.tabs button').forEach(function(b){b.addEventListener('click',function(){$('#app').setAttribute('data-pane',b.getAttribute('data-pane'));syncTabs()})});
$('#cmd').addEventListener('submit',function(e){e.preventDefault();var i=$('#in'),v=i.value.trim();i.value='';if(v)typed(v)});
var rt=null;
$('#restart').addEventListener('click',function(){
  var b=$('#restart');
  if(rt){clearTimeout(rt);rt=null;b.textContent='New game';newGame();return}
  b.textContent='Tap again to restart';rt=setTimeout(function(){rt=null;b.textContent='New game'},3000);
});
var saved=load();
if(saved){S=saved;rendered=0;renderAll();var lg=$('#log');lg.scrollTop=lg.scrollHeight}
else newGame();
})();
</script>

</body>
</html>
