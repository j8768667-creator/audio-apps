<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Audio Apps">
<title>Audio Apps</title>
<style>
  :root { --bg:#111418; --card:#1e242c; --text:#f2f4f7; --accent:#6ea8fe; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f3f4f6; --card:#fff; --text:#16191d; --accent:#1d5fd1; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:max(24px, env(safe-area-inset-top)) 20px 40px;
         background:var(--bg); color:var(--text);
         font:17px/1.4 -apple-system, system-ui, sans-serif; }
  h1 { font-size:28px; margin:0 0 16px; }
  input { width:100%; padding:14px 16px; font-size:17px; border-radius:12px;
          border:1px solid #8884; background:var(--card); color:var(--text); margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; }
  a.card { display:flex; align-items:center; justify-content:center; text-align:center;
           min-height:110px; padding:16px; border-radius:16px; background:var(--card);
           color:var(--text); text-decoration:none; font-weight:600;
           box-shadow:0 1px 3px #0003; }
  a.card:active { outline:2px solid var(--accent); }
  .msg { opacity:.7; }
  .card { overflow-wrap:anywhere; }
  .tile details { margin-top:6px; font-size:14px; }
  .tile summary { opacity:.6; padding:6px 4px; cursor:pointer; }
  .tile details a { display:block; padding:8px 4px; color:var(--accent);
                    text-decoration:none; overflow-wrap:anywhere; }
</style>
</head>
<body>
<h1>🎧 Audio Apps</h1>
<input id="q" type="search" placeholder="Search apps…" autocomplete="off">
<div id="grid" class="grid"></div>
<p id="msg" class="msg">Loading…</p>
<script>
// Works automatically on GitHub Pages: owner/repo are read from the URL.
// To override, set e.g. const OVERRIDE = {owner:"me", repo:"my-apps"};
const OVERRIDE = null;

const host = location.hostname;
const owner = OVERRIDE?.owner ?? host.split(".")[0];
const repo  = OVERRIDE?.repo  ?? (location.pathname.split("/")[1] || host);

const pretty = s => decodeURIComponent(s).replace(/[-_]+/g, " ")
  .replace(/\b\w/g, c => c.toUpperCase());

let apps = [];
const grid = document.getElementById("grid");
const msg = document.getElementById("msg");

function render() {
  const q = document.getElementById("q").value.toLowerCase();
  const shown = apps.filter(a => a.label.toLowerCase().includes(q));
  grid.innerHTML = "";
  shown.forEach(a => {
    const wrap = document.createElement("div");
    wrap.className = "tile";
    const el = document.createElement("a");
    el.className = "card"; el.href = a.href; el.textContent = a.label;
    wrap.appendChild(el);
    if (a.others && a.others.length) {
      const d = document.createElement("details");
      const s = document.createElement("summary");
      s.textContent = a.others.length + " more file" + (a.others.length > 1 ? "s" : "");
      d.appendChild(s);
      a.others.forEach(o => {
        const l = document.createElement("a");
        l.href = o.href; l.textContent = o.label; d.appendChild(l);
      });
      wrap.appendChild(d);
    }
    grid.appendChild(wrap);
  });
  msg.textContent = shown.length ? "" : "No apps found.";
}

(async () => {
  try {
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/HEAD?recursive=1`);
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    // Group HTML files by top-level folder (any file name, case-insensitive)
    const byFolder = {};
    data.tree.forEach(t => {
      const m = t.path.match(/^([^/]+)\/([^/]+\.html?)$/i);
      if (!m || /^[._]/.test(m[1])) return;
      (byFolder[m[1]] = byFolder[m[1]] || []).push(m[2]);
    });
    apps = [];
    const link = (folder, f) => encodeURIComponent(folder) + "/" + encodeURIComponent(f);
    Object.entries(byFolder).forEach(([folder, files]) => {
      files.sort((a, b) => a.length - b.length);
      // main file: index.html, else one with "main", else one with "index", else shortest
      const main = files.find(f => /^index\.html?$/i.test(f))
        || files.find(f => /main/i.test(f))
        || files.find(f => /index/i.test(f))
        || files[0];
      const others = files.filter(f => f !== main).map(f =>
        ({ label: pretty(f.replace(/\.html?$/i, "")), href: link(folder, f) }));
      apps.push({ label: pretty(folder), href: link(folder, main), others });
    });
    apps.sort((a, b) => a.label.localeCompare(b.label));
    render();
  } catch (e) {
    msg.textContent = "Couldn't load the app list (" + e.message + "). Is the repo public and hosted on GitHub Pages?";
  }
})();
document.getElementById("q").addEventListener("input", render);
</script>
</body>
</html>
