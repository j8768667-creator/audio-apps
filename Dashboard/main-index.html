<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My iPad Web Apps</title>
    <!-- Basic styling to make it feel like an iOS app dashboard -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f7;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #1c1c1e;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .app-card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: #3a3a3c;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-card:active {
            transform: scale(0.95);
            background-color: #e5e5ea;
        }
        .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .title {
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <h1>My HTML App Dashboard</h1>

    <div class="grid">
        <!-- APP 1 -->
